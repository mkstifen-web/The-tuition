<!DOCTYPE html>
<html>
<head>
  <title>Mock IQ Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #003366;
      margin: 20px;
    }
    h1 {
      text-align: center;
      color: #004080;
    }
    .question {
      background: #e6f2ff;
      border: 1px solid #004080;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    button {
      background-color: #004080;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0066cc;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
      color: #004080;
    }
    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Mock IQ Fun Test</h1>
  <p style="text-align:center;">This is just a fun IQ-style mock drill, not a real IQ test.</p>

  <form id="quizForm">
    <!-- Example Questions -->
    <div class="question">
      <p>1. What is 12 × 8?</p>
      <input type="radio" name="q1" value="96">96<br>
      <input type="radio" name="q1" value="108">108<br>
      <input type="radio" name="q1" value="88">88<br>
    </div>

    <div class="question">
      <p>2. Which gas is most abundant in Earth’s atmosphere?</p>
      <input type="radio" name="q2" value="Oxygen">Oxygen<br>
      <input type="radio" name="q2" value="Nitrogen">Nitrogen<br>
      <input type="radio" name="q2" value="Carbon Dioxide">Carbon Dioxide<br>
    </div>

    <div class="question">
      <p>3. If a train travels 60 km in 1.5 hours, what is its speed?</p>
      <input type="radio" name="q3" value="40">40 km/h<br>
      <input type="radio" name="q3" value="45">45 km/h<br>
      <input type="radio" name="q3" value="50">50 km/h<br>
    </div>

    <!-- Add more questions up to 20 in same format -->

    <button type="button" onclick="checkAnswers()">Submit</button>
  </form>

  <div class="result" id="result"></div>
  <div id="errors"></div>

  <script>
    const answers = {
      q1: "96",
      q2: "Nitrogen",
      q3: "40"
      // Continue adding correct answers for q4–q20
    };

    function checkAnswers() {
      let score = 0;
      let total = Object.keys(answers).length;
      let errorList = [];

      for (let key in answers) {
        let radios = document.getElementsByName(key);
        let selected = null;
        for (let r of radios) {
          if (r.checked) {
            selected = r.value;
          }
        }
        if (selected === answers[key]) {
          score++;
        } else {
          errorList.push("Error in Question " + key.substring(1));
        }
      }

      let percent = Math.round((score / total) * 100);
      document.getElementById("result").innerHTML = 
        "You scored " + score + " out of " + total + " (" + percent + "%).";

      let errorText = "";
      if (errorList.length > 0) {
        errorText = "<p class='error'>Mistakes found in: " + errorList.join(", ") + "</p>";
      } else {
        errorText = "<p class='error'>No mistakes! Great job!</p>";
      }
      document.getElementById("errors").innerHTML = errorText;
    }
  </script>
</body>
</html>
